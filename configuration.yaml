# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

# Helpers (input_number / input_boolean / input_select / timer) live in
# helpers.yaml under version control instead of the UI. helpers.yaml keeps its
# per-domain top-level keys, which is exactly the shape a package expects, so the
# whole file merges in as one package. After editing helpers.yaml, reload the
# affected domain from Developer Tools → YAML (or restart HA).
homeassistant:
  packages:
    helpers: !include helpers.yaml

neviweb130:
  username: !secret neviweb130_username
  password: !secret neviweb130_password
  network: "Studio"
  scan_interval: 250
  homekit_mode: False
  stat_interval: 300
  notify: "both"

template:
  - sensor:
      - name: "Studio Baseboard Heater energy usage"
        unique_id: sensor.studio_energy_usage
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total
        state: >-
          {{ state_attr("climate.neviweb130_climate_th1124wf","hourly_kwh") }}
      - name: "Studio baseboard heater energy usage count"
        unique_id: sensor.studio_energy_usage_count
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        state: >-
          {{ state_attr("climate.neviweb130_climate_th1124wf","hourly_kwh_count") }}
      - name: "Office Baseboard Heater energy usage"
        unique_id: sensor.office_energy_usage
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total
        state: >-
          {{ state_attr("climate.neviweb130_climate_th1123wf","hourly_kwh") }}
      - name: "Office baseboard heater energy usage count"
        unique_id: sensor.office_energy_usage_count
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        state: >-
          {{ state_attr("climate.neviweb130_climate_th1123wf","hourly_kwh_count") }}
      - name: "Office baseboard Current Temperature"
        unique_id: sensor.office_baseboard_current_temperature
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        state: >-
          {{ state_attr("climate.neviweb130_climate_th1123wf","current_temperature") }}
      - name: "Studio baseboard Current Temperature"
        unique_id: sensor.studio_baseboard_current_temperature
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        state: >-
          {{ state_attr("climate.neviweb130_climate_th1124wf","current_temperature") }}
      - name: "Humidity High Threshold"
        unique_id: sensor.humidity_high_threshold
        unit_of_measurement: "%"
        device_class: humidity
        state_class: measurement
        state: >-
          {{ states('input_number.humidity_set_point') | float
             + states('input_number.humidity_tolerance') | float }}
      - name: "Humidity Low Threshold"
        unique_id: sensor.humidity_low_threshold
        unit_of_measurement: "%"
        device_class: humidity
        state_class: measurement
        state: >-
          {{ states('input_number.humidity_set_point') | float
             - states('input_number.humidity_tolerance') | float }}
  # The studio thermostat sits in the dehumidifier's exhaust path, which lifts it
  # up to 3 °C above the room for ~15 minutes and reads as a satisfied room. The
  # filter holds the last plausible value across the plume. The time_pattern
  # trigger is what expires a hold when the source stops changing.
  - trigger:
      - trigger: state
        entity_id: sensor.studio_baseboard_current_temperature
      - trigger: homeassistant
        event: start
      - trigger: time_pattern
        minutes: /5
    sensor:
      - name: "Studio control temperature"
        unique_id: sensor.studio_control_temperature
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        # `states.sensor.x` is None until that entity exists, and attribute
        # access on None raises, so the source timestamp is guarded.
        state: >-
          {% from 'hvac.jinja' import slew_filter %}
          {% set src = states.sensor.studio_baseboard_current_temperature %}
          {{- (slew_filter(
                 states('sensor.studio_baseboard_current_temperature'),
                 src.last_changed.isoformat() if src else '',
                 this.state,
                 this.attributes.get('value_at', ''),
                 this.attributes.get('hold_since', ''),
                 this.attributes.get('pending', ''),
                 this.attributes.get('pending_at', ''),
                 now().isoformat(), 1.0, 0.5, 20) | from_json).value -}}
        attributes:
          hold_since: >-
            {% from 'hvac.jinja' import slew_filter %}
            {% set src = states.sensor.studio_baseboard_current_temperature %}
            {{- (slew_filter(
                   states('sensor.studio_baseboard_current_temperature'),
                   src.last_changed.isoformat() if src else '',
                   this.state,
                   this.attributes.get('value_at', ''),
                   this.attributes.get('hold_since', ''),
                   this.attributes.get('pending', ''),
                   this.attributes.get('pending_at', ''),
                   now().isoformat(), 1.0, 0.5, 20) | from_json).hold_since -}}
          # When the state was accepted. HA restores this sensor across a
          # restart, and a value older than the hold cap is a stale room.
          value_at: >-
            {% from 'hvac.jinja' import slew_filter %}
            {% set src = states.sensor.studio_baseboard_current_temperature %}
            {{- (slew_filter(
                   states('sensor.studio_baseboard_current_temperature'),
                   src.last_changed.isoformat() if src else '',
                   this.state,
                   this.attributes.get('value_at', ''),
                   this.attributes.get('hold_since', ''),
                   this.attributes.get('pending', ''),
                   this.attributes.get('pending_at', ''),
                   now().isoformat(), 1.0, 0.5, 20) | from_json).value_at -}}
          # The seed candidate: with no accepted history, a reading is kept here
          # until a *later* source update lands within the reject band of it.
          pending: >-
            {% from 'hvac.jinja' import slew_filter %}
            {% set src = states.sensor.studio_baseboard_current_temperature %}
            {{- (slew_filter(
                   states('sensor.studio_baseboard_current_temperature'),
                   src.last_changed.isoformat() if src else '',
                   this.state,
                   this.attributes.get('value_at', ''),
                   this.attributes.get('hold_since', ''),
                   this.attributes.get('pending', ''),
                   this.attributes.get('pending_at', ''),
                   now().isoformat(), 1.0, 0.5, 20) | from_json).pending -}}
          # The candidate's source timestamp, which is what tells a second
          # reading apart from the /5 heartbeat re-rendering the first.
          pending_at: >-
            {% from 'hvac.jinja' import slew_filter %}
            {% set src = states.sensor.studio_baseboard_current_temperature %}
            {{- (slew_filter(
                   states('sensor.studio_baseboard_current_temperature'),
                   src.last_changed.isoformat() if src else '',
                   this.state,
                   this.attributes.get('value_at', ''),
                   this.attributes.get('hold_since', ''),
                   this.attributes.get('pending', ''),
                   this.attributes.get('pending_at', ''),
                   now().isoformat(), 1.0, 0.5, 20) | from_json).pending_at -}}

notify:
  - platform: group
    name: "Notification Group"
    services:
      - action: mobile_app_pixel_8

# Display/entry facade for ecobee-style dual-setpoint thermostat cards.
# Requires the HACS "Climate Template" integration (platform: climate_template).
# These entities issue NO direct device calls — all real control lives in the
# hvac_coordinator automation. Confirm exact field names against the installed
# integration's README before deploying.
climate:
  - platform: climate_template
    name: Office Thermostat
    unique_id: office_thermostat
    modes:
      - "off"
      - "heat_cool"
    min_temp: 17
    max_temp: 30
    temp_step: 0.5
    current_temperature_template: "{{ states('sensor.office_baseboard_current_temperature') }}"
    target_temperature_low_template: "{{ states('input_number.office_heat_bound') }}"
    target_temperature_high_template: "{{ states('input_number.office_cool_bound') }}"
    hvac_mode_template: "{{ 'heat_cool' if is_state('input_boolean.hvac_enable', 'on') else 'off' }}"
    hvac_action_template: >-
      {% if not is_state('input_boolean.hvac_enable', 'on') %}off
      {%- elif is_state('switch.office_power', 'on') and is_state('input_select.system_hvac_mode', 'heat') %}heating
      {%- elif is_state('switch.office_power', 'on') and is_state('input_select.system_hvac_mode', 'cool') %}cooling
      {%- else %}idle{% endif %}
    set_temperature:
      - action: input_number.set_value
        target:
          entity_id: input_number.office_heat_bound
        data:
          value: "{{ target_temp_low }}"
      - action: input_number.set_value
        target:
          entity_id: input_number.office_cool_bound
        data:
          value: "{{ target_temp_high }}"
    set_hvac_mode:
      - action: "input_boolean.turn_{{ 'on' if hvac_mode == 'heat_cool' else 'off' }}"
        target:
          entity_id: input_boolean.hvac_enable
  - platform: climate_template
    name: Studio Thermostat
    unique_id: studio_thermostat
    modes:
      - "off"
      - "heat_cool"
    min_temp: 17
    max_temp: 30
    temp_step: 0.5
    current_temperature_template: "{{ states('sensor.studio_control_temperature') }}"
    target_temperature_low_template: "{{ states('input_number.studio_heat_bound') }}"
    target_temperature_high_template: "{{ states('input_number.studio_cool_bound') }}"
    hvac_mode_template: "{{ 'heat_cool' if is_state('input_boolean.hvac_enable', 'on') else 'off' }}"
    hvac_action_template: >-
      {% if not is_state('input_boolean.hvac_enable', 'on') %}off
      {%- elif is_state('switch.studio_power', 'on') and is_state('input_select.system_hvac_mode', 'heat') %}heating
      {%- elif is_state('switch.studio_power', 'on') and is_state('input_select.system_hvac_mode', 'cool') %}cooling
      {%- else %}idle{% endif %}
    set_temperature:
      - action: input_number.set_value
        target:
          entity_id: input_number.studio_heat_bound
        data:
          value: "{{ target_temp_low }}"
      - action: input_number.set_value
        target:
          entity_id: input_number.studio_cool_bound
        data:
          value: "{{ target_temp_high }}"
    set_hvac_mode:
      - action: "input_boolean.turn_{{ 'on' if hvac_mode == 'heat_cool' else 'off' }}"
        target:
          entity_id: input_boolean.hvac_enable
