# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

neviweb130:
  username: !secret neviweb130_username
  password: !secret neviweb130_password
  network: "Studio"
  scan_interval: 250
  homekit_mode: False
  stat_interval: 300
  notify: "both"

template:
  - sensor:
      - name: "Studio Baseboard Heater energy usage"
        unique_id: sensor.studio_energy_usage
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total
        state: >-
          {{ state_attr("climate.neviweb130_climate_th1124wf","hourly_kwh") }}
      - name: "Studio baseboard heater energy usage count"
        unique_id: sensor.studio_energy_usage_count
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        state: >-
          {{ state_attr("climate.neviweb130_climate_th1124wf","hourly_kwh_count") }}
      - name: "Office Baseboard Heater energy usage"
        unique_id: sensor.office_energy_usage
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total
        state: >-
          {{ state_attr("climate.neviweb130_climate_th1123wf","hourly_kwh") }}
      - name: "Office baseboard heater energy usage count"
        unique_id: sensor.office_energy_usage_count
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: measurement
        state: >-
          {{ state_attr("climate.neviweb130_climate_th1123wf","hourly_kwh_count") }}
      - name: "Office baseboard Current Temperature"
        unique_id: sensor.office_baseboard_current_temperature
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        state: >-
          {{ state_attr("climate.neviweb130_climate_th1123wf","current_temperature") }}
      - name: "Office Heat Pump Setpoint Temperature"
        unique_id: sensor.office_heat_pump_setpoint_temperature
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        state: >-
          {% from 'setpoint.jinja' import heat_pump_setpoint %}
          {{ heat_pump_setpoint(
              'climate.neviweb130_climate_th1123wf',
              'sensor.office_temperature',
              'input_number.office_preferred_temperature') }}
      - name: "Studio baseboard Current Temperature"
        unique_id: sensor.studio_baseboard_current_temperature
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        state: >-
          {{ state_attr("climate.neviweb130_climate_th1124wf","current_temperature") }}
      - name: "Studio Heat Pump Setpoint Temperature"
        unique_id: sensor.studio_heat_pump_setpoint_temperature
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        state: >-
          {% from 'setpoint.jinja' import heat_pump_setpoint %}
          {{ heat_pump_setpoint(
              'climate.neviweb130_climate_th1124wf',
              'sensor.studio_temperature',
              'input_number.studio_preferred_temperature') }}
      - name: "Humidity High Threshold"
        unique_id: sensor.humidity_high_threshold
        unit_of_measurement: "%"
        device_class: humidity
        state_class: measurement
        state: >-
          {{ states('input_number.humidity_set_point') | float
             + states('input_number.humidity_tolerance') | float }}
      - name: "Humidity Low Threshold"
        unique_id: sensor.humidity_low_threshold
        unit_of_measurement: "%"
        device_class: humidity
        state_class: measurement
        state: >-
          {{ states('input_number.humidity_set_point') | float
             - states('input_number.humidity_tolerance') | float }}
  # Changeover advisor: degree-hour balance over the next 48 h of EC hourly
  # forecast. Refreshes hourly and on HA start; goes unavailable when the
  # forecast call fails (continue_on_error leaves changeover_forecast
  # undefined → availability false), which short-circuits the advisor.
  # Design: docs/superpowers/specs/2026-06-07-changeover-advisor-design.md
  # State is routinely negative (CDH − HDH): negative = net heating load. Not a sign error.
  - triggers:
      - trigger: time_pattern
        minutes: "0"
      - trigger: homeassistant
        event: start
    actions:
      - action: weather.get_forecasts
        data:
          type: hourly
        target:
          entity_id: weather.lethbridge
        response_variable: changeover_forecast
        continue_on_error: true
      - action: weather.get_forecasts
        data:
          type: daily
        target:
          entity_id: weather.lethbridge
        response_variable: changeover_daily_forecast
        continue_on_error: true
    sensor:
      - name: "Changeover Balance"
        unique_id: sensor.changeover_balance
        unit_of_measurement: "°C·h"
        state_class: measurement
        availability: >-
          {{ changeover_forecast is defined
             and (changeover_forecast['weather.lethbridge']['forecast'] | count) > 0
             and changeover_daily_forecast is defined
             and (changeover_daily_forecast['weather.lethbridge']['forecast'] | count) >= 2 }}
        state: >-
          {% from 'changeover.jinja' import heating_degree_hours, cooling_degree_hours %}
          {% set temps = changeover_forecast['weather.lethbridge']['forecast'][:48]
                         | map(attribute='temperature') | list %}
          {% set bp = states('input_number.changeover_balance_point') | float(16) %}
          {{ (cooling_degree_hours(temps, bp) | float)
             - (heating_degree_hours(temps, bp) | float) }}
        attributes:
          cdh: >-
            {% from 'changeover.jinja' import cooling_degree_hours %}
            {% set temps = changeover_forecast['weather.lethbridge']['forecast'][:48]
                           | map(attribute='temperature') | list %}
            {{ cooling_degree_hours(temps,
                 states('input_number.changeover_balance_point') | float(16)) | float }}
          hdh: >-
            {% from 'changeover.jinja' import heating_degree_hours %}
            {% set temps = changeover_forecast['weather.lethbridge']['forecast'][:48]
                           | map(attribute='temperature') | list %}
            {{ heating_degree_hours(temps,
                 states('input_number.changeover_balance_point') | float(16)) | float }}
          forecast_hours: >-
            {{ changeover_forecast['weather.lethbridge']['forecast'][:48] | count }}
          daily_cdh: >-
            {% from 'changeover.jinja' import daily_means, cooling_degree_hours %}
            {% set means = daily_means(
                 changeover_daily_forecast['weather.lethbridge']['forecast'][:2]) | from_json %}
            {{ cooling_degree_hours(means,
                 states('input_number.changeover_balance_point') | float(16)) | float }}
          daily_hdh: >-
            {% from 'changeover.jinja' import daily_means, heating_degree_hours %}
            {% set means = daily_means(
                 changeover_daily_forecast['weather.lethbridge']['forecast'][:2]) | from_json %}
            {{ heating_degree_hours(means,
                 states('input_number.changeover_balance_point') | float(16)) | float }}
          daily_forecast_days: >-
            {{ changeover_daily_forecast['weather.lethbridge']['forecast'][:2] | count }}

notify:
  - platform: group
    name: "Notification Group"
    services:
      - action: mobile_app_pixel_8

# Changeover advisor evidence sensors. Duty cycles are the load witness
# (history_stats ratio, PERCENT 0-100); the smoothed means ride out sensor
# noise and head overshoot — the office gets the longer window because its
# oversized head overshoots harder.
# sampling_size 60 ≈ 2x the ~28 samples a 2 h window sees at the ~250 s neviweb scan_interval.
sensor:
  - platform: statistics
    name: "Office Temperature 2h Mean"
    unique_id: office_temperature_2h_mean
    entity_id: sensor.office_baseboard_current_temperature
    state_characteristic: mean
    sampling_size: 60
    max_age:
      hours: 2
  - platform: statistics
    name: "Studio Temperature 1h Mean"
    unique_id: studio_temperature_1h_mean
    entity_id: sensor.studio_baseboard_current_temperature
    state_characteristic: mean
    sampling_size: 60
    max_age:
      hours: 1
  - platform: history_stats
    name: "Office Heat Pump Duty 24h"
    unique_id: office_heat_pump_duty_24h
    entity_id: switch.office_power
    state: "on"
    type: ratio
    end: "{{ now() }}"
    duration:
      hours: 24
  - platform: history_stats
    name: "Studio Heat Pump Duty 24h"
    unique_id: studio_heat_pump_duty_24h
    entity_id: switch.studio_power
    state: "on"
    type: ratio
    end: "{{ now() }}"
    duration:
      hours: 24
