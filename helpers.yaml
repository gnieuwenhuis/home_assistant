# This file is merged into the HA config as a package — see the
# `homeassistant: packages:` block in configuration.yaml. The values here are
# authoritative; edit here, not in the UI.
#
# One-time cutover (UI-defined → this file). Until both of these are done, the
# UI helper and the YAML helper fight over the same entity_id (HA either skips
# the YAML one or creates a `_2` duplicate):
#   1. Deploy this file + the configuration.yaml package block to the host.
#   2. In Settings → Devices & services → Helpers, delete every helper that is
#      defined below (they're the UI copies of the same entity_ids).
#   3. Restart HA so the package is loaded.
# After cutover, an edit to this file applies via Developer Tools → YAML →
# reload the affected domain (Input Number / Input Boolean / Input Select /
# Timer), or a restart.
#
# Note on backup_heat: its UI-defined unique_id is `disable_heat_pump` but
# the entity was renamed in the UI to `input_boolean.backup_heat` (which
# is what automations.yaml references). In YAML the key below IS the
# entity_id, so it's `backup_heat` directly — the rename collapses away.

input_number:
  humidity_set_point:
    name: Humidity Set Point
    min: 0
    max: 100
    step: 1
    mode: box
    unit_of_measurement: "%"
    icon: mdi:water-percent

  humidity_tolerance:
    name: Humidity Tolerance
    min: 0
    max: 100
    step: 1
    mode: box
    unit_of_measurement: "%"
    icon: mdi:water-percent

  office_heat_bound:
    name: Office Heat Bound
    min: 15
    max: 30
    step: 0.5
    mode: slider
    unit_of_measurement: "°C"
    icon: mdi:thermometer-chevron-down
  office_cool_bound:
    name: Office Cool Bound
    min: 15
    max: 30
    step: 0.5
    mode: slider
    unit_of_measurement: "°C"
    icon: mdi:thermometer-chevron-up
  studio_heat_bound:
    name: Studio Heat Bound
    min: 15
    max: 30
    step: 0.5
    mode: slider
    unit_of_measurement: "°C"
    icon: mdi:thermometer-chevron-down
  studio_cool_bound:
    name: Studio Cool Bound
    min: 15
    max: 30
    step: 0.5
    mode: slider
    unit_of_measurement: "°C"
    icon: mdi:thermometer-chevron-up
  office_temp_differential:
    name: Office Temp Differential
    min: 0
    max: 3
    step: 0.1
    mode: box
    unit_of_measurement: "°C"
    icon: mdi:arrow-expand-vertical
  studio_temp_differential:
    name: Studio Temp Differential
    min: 0
    max: 3
    step: 0.1
    mode: box
    unit_of_measurement: "°C"
    icon: mdi:arrow-expand-vertical

input_boolean:
  backup_heat:
    name: Backup Heat Mode
    icon: mdi:snowflake-thermometer
  dehumidifier_intended:
    name: Dehumidifier Intended
    icon: mdi:air-humidifier-off
  humidifier_intended:
    name: Humidifier Intended
    icon: mdi:air-humidifier
  hvac_enable:
    name: HVAC Enable
    icon: mdi:hvac

input_select:
  system_hvac_mode:
    name: System HVAC Mode
    icon: mdi:heat-pump
    options:
      - idle
      - heat
      - cool
      - "off"

timer:
  # Cross-device cooldowns: each is armed when its OWN device turns off and
  # blocks the OPPOSITE device's turn-on, so a turn-off overshoot recovers
  # before the other device reacts. A device's own cooldown never blocks that
  # same device re-engaging — the tight ±tolerance band governs same-device
  # cycling — so the dehumidifier re-engages at its high threshold instead of
  # drifting up while a single shared cooldown runs. 30 min outlasts the
  # observed overshoot recovery under high outdoor humidity.
  dehumidify_cooldown:
    name: Dehumidify Cooldown
    duration: "00:30:00"
    restore: true
  humidify_cooldown:
    name: Humidify Cooldown
    duration: "00:30:00"
    restore: true
  dehumidifier_manual_grace:
    name: Dehumidifier Manual Grace
    duration: "00:15:00"
    restore: true
  humidifier_manual_grace:
    name: Humidifier Manual Grace
    duration: "00:15:00"
    restore: true

  mode_min_dwell:
    name: Mode Min Dwell
    duration: "00:15:00"
    restore: true
  office_head_lockout:
    name: Office Head Lockout
    duration: "00:08:00"
    restore: true
  studio_head_lockout:
    name: Studio Head Lockout
    duration: "00:06:00"
    restore: true
