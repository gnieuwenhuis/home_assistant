# Values copied from .storage/ on the HA host. The values here are
# authoritative — if you change anything in the HA UI, mirror it here.
#
# Migration steps (one-time, to start using this file):
#   1. In Settings → Devices & services → Helpers, delete each of the
#      helpers below. (UI-defined and YAML-defined helpers with the same
#      entity_id will conflict.)
#   2. Add these four lines to configuration.yaml (top level):
#        input_number:  !include helpers.yaml
#        input_boolean: !include helpers.yaml
#        input_select:  !include helpers.yaml
#        timer:         !include helpers.yaml
#      (HA reads each top-level key from the included file.)
#   3. From Developer Tools → YAML, reload "Input Number", "Input Boolean",
#      "Input Select", and "Timer" — or restart HA.
#
# Note on backup_heat: its UI-defined unique_id is `disable_heat_pump` but
# the entity was renamed in the UI to `input_boolean.backup_heat` (which
# is what automations.yaml references). In YAML the key below IS the
# entity_id, so it's `backup_heat` directly — the rename collapses away.

input_number:
  humidity_set_point:
    name: Humidity Set Point
    min: 0
    max: 100
    step: 1
    mode: box
    unit_of_measurement: "%"
    icon: mdi:water-percent

  humidity_tolerance:
    name: Humidity Tolerance
    min: 0
    max: 100
    step: 1
    mode: box
    unit_of_measurement: "%"
    icon: mdi:water-percent

  office_heat_bound:
    name: Office Heat Bound
    min: 15
    max: 30
    step: 0.5
    mode: slider
    unit_of_measurement: "°C"
    icon: mdi:thermometer-chevron-down
  office_cool_bound:
    name: Office Cool Bound
    min: 15
    max: 30
    step: 0.5
    mode: slider
    unit_of_measurement: "°C"
    icon: mdi:thermometer-chevron-up
  studio_heat_bound:
    name: Studio Heat Bound
    min: 15
    max: 30
    step: 0.5
    mode: slider
    unit_of_measurement: "°C"
    icon: mdi:thermometer-chevron-down
  studio_cool_bound:
    name: Studio Cool Bound
    min: 15
    max: 30
    step: 0.5
    mode: slider
    unit_of_measurement: "°C"
    icon: mdi:thermometer-chevron-up
  office_temp_differential:
    name: Office Temp Differential
    min: 0
    max: 3
    step: 0.1
    mode: box
    unit_of_measurement: "°C"
    icon: mdi:arrow-expand-vertical
  studio_temp_differential:
    name: Studio Temp Differential
    min: 0
    max: 3
    step: 0.1
    mode: box
    unit_of_measurement: "°C"
    icon: mdi:arrow-expand-vertical

input_boolean:
  backup_heat:
    name: Backup Heat Mode
    icon: mdi:snowflake-thermometer
  dehumidifier_intended:
    name: Dehumidifier Intended
    icon: mdi:air-humidifier-off
  humidifier_intended:
    name: Humidifier Intended
    icon: mdi:air-humidifier
  hvac_enable:
    name: HVAC Enable
    icon: mdi:hvac

input_select:
  system_hvac_mode:
    name: System HVAC Mode
    icon: mdi:heat-pump
    options:
      - idle
      - heat
      - cool
      - "off"

timer:
  humidity_cooldown:
    name: Humidity Cooldown
    duration: "00:15:00"
    restore: true
  dehumidifier_manual_grace:
    name: Dehumidifier Manual Grace
    duration: "00:15:00"
    restore: true
  humidifier_manual_grace:
    name: Humidifier Manual Grace
    duration: "00:15:00"
    restore: true

  mode_min_dwell:
    name: Mode Min Dwell
    duration: "00:15:00"
    restore: true
  office_head_lockout:
    name: Office Head Lockout
    duration: "00:08:00"
    restore: true
  studio_head_lockout:
    name: Studio Head Lockout
    duration: "00:06:00"
    restore: true
