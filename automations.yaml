# ============================================================
# HVAC controllers
# ------------------------------------------------------------
# One coordinator drives the multi-split (shared compressor →
# one system-wide heat/cool mode). It reads both rooms' two-
# setpoint demand (heat below heat_bound, cool above cool_bound,
# with a hysteresis differential past each bound), resolves a
# single system-wide mode where heating wins any conflict, then
# drives each head's power switch + climate target toward its
# bound (a per-room heating lead — studio above the bound, office
# at it — keeps the inverter committed; the baseboard sensor does
# the real cutoff). Short-cycle protection comes from per-head lockout
# timers and a heat<->cool minimum dwell that pins the active
# mode. Master-off (input_boolean.hvac_enable off) and backup-
# heat force both heads off. Cielo calls are gated per branch on
# a real desired-vs-current delta; the off->on branch's
# set_temperature rides the turn_on ungated, because the climate
# snapshot in `variables:` predates the power-on.
# ============================================================

- id: hvac_coordinator
  alias: HVAC Coordinator
  description: >-
    One coordinator for the multi-split. Resolves a single system-wide mode from
    both rooms' two-setpoint demand (heating wins conflicts), then drives each
    head on/off toward its bounds. Short-cycle protected by per-head lockout
    timers and a heat<->cool dwell. Master-off / backup-heat force both heads
    off. Cielo calls gated per branch on a real desired-vs-current delta; the
    off->on branch's set_temperature rides the turn_on so the newly powered head
    lands in the right mode and target.
  triggers:
  - trigger: state
    entity_id:
    - sensor.office_baseboard_current_temperature
    - sensor.studio_baseboard_current_temperature
    - input_number.office_heat_bound
    - input_number.office_cool_bound
    - input_number.studio_heat_bound
    - input_number.studio_cool_bound
    - input_number.office_temp_differential
    - input_number.studio_temp_differential
    - input_boolean.hvac_enable
    - input_boolean.backup_heat
  - trigger: event
    event_type: timer.finished
    event_data:
      entity_id: timer.mode_min_dwell
  - trigger: event
    event_type: timer.finished
    event_data:
      entity_id: timer.office_head_lockout
  - trigger: event
    event_type: timer.finished
    event_data:
      entity_id: timer.studio_head_lockout
  - trigger: homeassistant
    event: start
  - trigger: time_pattern
    minutes: /5
  variables:
    # Per-room HEATING lead (cooling unaffected). The large/slow studio's onboard
    # sensor reads warm (it sits in the return airflow), so commanding the bound
    # itself leaves the inverter loafing and the room sags ~1 C under setpoint
    # before the head commits. A positive heat lead opens enough setpoint error to
    # make the inverter pull real capacity. This is SAFE because lead != cutoff:
    # the real cutoff is room_demand against the reliable baseboard sensor at
    # heat_bound + differential (studio 19.5), independent of the commanded
    # setpoint — so a higher lead changes how hard the head pulls, NOT where it
    # shuts off. The small/fast office holds fine, so it stays at its bound.
    # Tuning knob: raise studio_heat_lead toward 2.0-2.5 if the studio still sags.
    office_heat_lead: 0
    studio_heat_lead: 1.5
    enabled: "{{ is_state('input_boolean.hvac_enable', 'on') }}"
    backup: "{{ is_state('input_boolean.backup_heat', 'on') }}"
    stored: "{{ states('input_select.system_hvac_mode') }}"
    dwell_active: "{{ is_state('timer.mode_min_dwell', 'active') }}"
    office_temp: "{{ states('sensor.office_baseboard_current_temperature') | float(0) }}"
    studio_temp: "{{ states('sensor.studio_baseboard_current_temperature') | float(0) }}"
    office_hb: "{{ states('input_number.office_heat_bound') | float(0) }}"
    office_cb: "{{ states('input_number.office_cool_bound') | float(0) }}"
    studio_hb: "{{ states('input_number.studio_heat_bound') | float(0) }}"
    studio_cb: "{{ states('input_number.studio_cool_bound') | float(0) }}"
    office_diff: "{{ states('input_number.office_temp_differential') | float(0) }}"
    studio_diff: "{{ states('input_number.studio_temp_differential') | float(0) }}"
    office_switch_on: "{{ is_state('switch.office_power', 'on') }}"
    studio_switch_on: "{{ is_state('switch.studio_power', 'on') }}"
    office_dir: "{{ stored if office_switch_on and stored in ['heat', 'cool'] else 'none' }}"
    studio_dir: "{{ stored if studio_switch_on and stored in ['heat', 'cool'] else 'none' }}"
    office_demand: >-
      {% from 'hvac.jinja' import room_demand %}
      {{- room_demand(office_temp, office_hb, office_cb, office_diff, office_dir) -}}
    studio_demand: >-
      {% from 'hvac.jinja' import room_demand %}
      {{- room_demand(studio_temp, studio_hb, studio_cb, studio_diff, studio_dir) -}}
    resolved: >-
      {% from 'hvac.jinja' import resolve_mode %}
      {{- resolve_mode(office_demand, studio_demand) -}}
    effective: "{{ stored if (dwell_active and stored in ['heat', 'cool']) else resolved }}"
    # Resolve the per-room lead now that `effective` (the active mode) is known:
    # heat-only, so cooling/idle gets 0 and is unaffected.
    office_lead: "{{ office_heat_lead if effective == 'heat' else 0 }}"
    studio_lead: "{{ studio_heat_lead if effective == 'heat' else 0 }}"
    office_want_on: >-
      {{ (effective == 'heat' and office_demand == 'heat')
         or (effective == 'cool' and office_demand == 'cool') }}
    studio_want_on: >-
      {{ (effective == 'heat' and studio_demand == 'heat')
         or (effective == 'cool' and studio_demand == 'cool') }}
    desired_hvac: "{{ 'heat' if effective == 'heat' else 'cool' if effective == 'cool' else '' }}"
    office_target_raw: >-
      {% from 'hvac.jinja' import head_target %}
      {{- head_target(effective, office_hb, office_cb, office_lead) -}}
    studio_target_raw: >-
      {% from 'hvac.jinja' import head_target %}
      {{- head_target(effective, studio_hb, studio_cb, studio_lead) -}}
    office_target: "{{ office_target_raw | float(0) }}"
    studio_target: "{{ studio_target_raw | float(0) }}"
    office_lockout: "{{ is_state('timer.office_head_lockout', 'active') }}"
    studio_lockout: "{{ is_state('timer.studio_head_lockout', 'active') }}"
    current_office_hvac: "{{ states('climate.office') }}"
    current_studio_hvac: "{{ states('climate.studio') }}"
    current_office_target: "{{ state_attr('climate.office', 'temperature') | float(0) }}"
    current_studio_target: "{{ state_attr('climate.studio', 'temperature') | float(0) }}"
    safe_mode: "{{ 'off' if not enabled else 'idle' }}"
  conditions:
  - "{{ states('sensor.office_baseboard_current_temperature') not in ['unavailable', 'unknown'] }}"
  - "{{ states('sensor.studio_baseboard_current_temperature') not in ['unavailable', 'unknown'] }}"
  - "{{ states('switch.office_power') not in ['unavailable', 'unknown'] }}"
  - "{{ states('switch.studio_power') not in ['unavailable', 'unknown'] }}"
  - "{{ states('climate.office') not in ['unavailable', 'unknown'] }}"
  - "{{ states('climate.studio') not in ['unavailable', 'unknown'] }}"
  actions:
  - if: "{{ not enabled or backup }}"
    then:
    # Force-off ignores an active lockout, but still ARMS the lockout so a quick
    # re-enable / backup-heat flap can't restart the compressor immediately.
    - if: "{{ office_switch_on }}"
      then:
      - action: switch.turn_off
        target:
          entity_id: switch.office_power
      - action: timer.start
        target:
          entity_id: timer.office_head_lockout
    - if: "{{ studio_switch_on }}"
      then:
      - action: switch.turn_off
        target:
          entity_id: switch.studio_power
      - action: timer.start
        target:
          entity_id: timer.studio_head_lockout
    - if: "{{ stored != safe_mode }}"
      then:
      - action: input_select.select_option
        target:
          entity_id: input_select.system_hvac_mode
        data:
          option: "{{ safe_mode }}"
    - stop: master disabled or backup heat
  - if: "{{ effective != stored }}"
    then:
    - action: input_select.select_option
      target:
        entity_id: input_select.system_hvac_mode
      data:
        option: "{{ effective }}"
    - if: "{{ effective in ['heat', 'cool'] }}"
      then:
      - action: timer.start
        target:
          entity_id: timer.mode_min_dwell
  - choose:
    - conditions: "{{ office_want_on and not office_switch_on and not office_lockout }}"
      sequence:
      - action: switch.turn_on
        target:
          entity_id: switch.office_power
      - action: climate.set_temperature
        target:
          entity_id: climate.office
        data:
          temperature: "{{ office_target }}"
          hvac_mode: "{{ desired_hvac }}"
      - action: timer.start
        target:
          entity_id: timer.office_head_lockout
    - conditions: >-
        {{ office_want_on and office_switch_on
           and (current_office_hvac != desired_hvac
                or current_office_target != office_target) }}
      sequence:
      - action: climate.set_temperature
        target:
          entity_id: climate.office
        data:
          temperature: "{{ office_target }}"
          hvac_mode: "{{ desired_hvac }}"
    # Turn OFF as soon as demand ends — NOT gated on the lockout. The lockout is
    # a minimum OFF-time (it gates the next turn-ON); blocking the off forces the
    # head to over-cool/over-heat past the bound. Arm the lockout on the off.
    - conditions: "{{ not office_want_on and office_switch_on }}"
      sequence:
      - action: switch.turn_off
        target:
          entity_id: switch.office_power
      - action: timer.start
        target:
          entity_id: timer.office_head_lockout
  - choose:
    - conditions: "{{ studio_want_on and not studio_switch_on and not studio_lockout }}"
      sequence:
      - action: switch.turn_on
        target:
          entity_id: switch.studio_power
      - action: climate.set_temperature
        target:
          entity_id: climate.studio
        data:
          temperature: "{{ studio_target }}"
          hvac_mode: "{{ desired_hvac }}"
      - action: timer.start
        target:
          entity_id: timer.studio_head_lockout
    - conditions: >-
        {{ studio_want_on and studio_switch_on
           and (current_studio_hvac != desired_hvac
                or current_studio_target != studio_target) }}
      sequence:
      - action: climate.set_temperature
        target:
          entity_id: climate.studio
        data:
          temperature: "{{ studio_target }}"
          hvac_mode: "{{ desired_hvac }}"
    # Turn OFF as soon as demand ends — NOT gated on the lockout (see office).
    - conditions: "{{ not studio_want_on and studio_switch_on }}"
      sequence:
      - action: switch.turn_off
        target:
          entity_id: switch.studio_power
      - action: timer.start
        target:
          entity_id: timer.studio_head_lockout
  mode: single

# ============================================================
# Backup heat
# ------------------------------------------------------------
# Heat pumps lose efficiency below -12 °C. Below that outdoor
# temperature input_boolean.backup_heat goes on — the
# coordinator reads it as a force-off for both heads — and the
# Sinopé baseboards carry the load at the room's comfort
# midpoint (heat_bound + cool_bound) / 2. Above it, the
# baseboards sit at heat_bound - 2.5 °C, under the heat pump's
# own heat bound, so the pump takes primary duty.
# ============================================================

- id: '1756873917108'
  alias: Disable Heat Pump in Cold Weather
  description: ''
  triggers:
  - trigger: numeric_state
    entity_id:
    - sensor.lethbridge_temperature
    for:
      hours: 0
      minutes: 20
      seconds: 0
    below: -12
  conditions:
  - condition: state
    entity_id: input_boolean.backup_heat
    state: 'off'
  actions:
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.backup_heat
  - action: climate.set_temperature
    target:
      entity_id: climate.neviweb130_climate_th1123wf
    data:
      temperature: >-
        {{ (states('input_number.office_heat_bound') | float
            + states('input_number.office_cool_bound') | float) / 2 }}
  - action: climate.set_temperature
    target:
      entity_id: climate.neviweb130_climate_th1124wf
    data:
      temperature: >-
        {{ (states('input_number.studio_heat_bound') | float
            + states('input_number.studio_cool_bound') | float) / 2 }}
  - action: notify.notification_group
    data:
      message: Heat Pump Heating is Disabled, Baseboard Heat is Being Used
  mode: single

- id: '1756874009383'
  alias: Enable Heat pump in warm weather
  description: ''
  triggers:
  - trigger: numeric_state
    entity_id:
    - sensor.lethbridge_temperature
    for:
      hours: 0
      minutes: 20
      seconds: 0
    above: -12
  conditions:
  - condition: state
    entity_id: input_boolean.backup_heat
    state: 'on'
  actions:
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.backup_heat
  - action: climate.set_temperature
    target:
      entity_id: climate.neviweb130_climate_th1123wf
    data:
      temperature: "{{ states('input_number.office_heat_bound') | float - 2.5 }}"
  - action: climate.set_temperature
    target:
      entity_id: climate.neviweb130_climate_th1124wf
    data:
      temperature: "{{ states('input_number.studio_heat_bound') | float - 2.5 }}"
  - action: notify.notification_group
    data:
      message: Heat Pump is Enabled
  mode: single

# ============================================================
# Humidity
# ------------------------------------------------------------
# One state-driven controller reconciles the studio humidifier
# and dehumidifier from the current humidity level. Reconciling
# from the reading rather than from threshold crossings is what
# makes a missed crossing harmless: nothing is stranded on. It:
#   - never lets both run at once (mutual-exclusion safety),
#   - arms a 30-min cooldown when it turns a device off, which
#     blocks the OPPOSITE device from starting (never its own),
#     so a turn-off overshoot recovers before the other device
#     reacts, and
#   - respects a manual switch flip for 15 min before resuming.
# Hysteresis around input_number.humidity_set_point with
# input_number.humidity_tolerance:
#   dehumidifier ON at set_point+tol, OFF below set_point
#   humidifier   ON at set_point-tol, OFF above set_point
# The manual detector tells controller-issued switch changes
# apart from manual ones via the *_intended mirror booleans.
# A third automation watches the dehumidifier's own power meter
# for current drawn with the switch off, which is a welded relay
# rather than anything the control loop can correct.
# ============================================================

- id: studio_humidity_controller
  alias: Studio Humidity Controller
  description: >-
    Reconcile the studio humidifier/dehumidifier from the current humidity
    level. Enforces mutual exclusion (never both on), per-device 30-min
    cross-device cooldowns (a device's turn-off blocks the OPPOSITE device's
    turn-on, never its own) so a turn-off overshoot recovers before the other
    device reacts, and a 15-min grace window after a manual switch flip. Fires on
    humidity/setpoint/switch/timer changes, HA start, and a 5-min heartbeat.
    Performs at most one action per run, gated on real deltas.
  triggers:
  - trigger: state
    entity_id:
    - sensor.tz3000_utwgoauk_snzb_02_humidity
    - input_number.humidity_set_point
    - input_number.humidity_tolerance
    - switch.studio_dehumidifier
    - switch.studio_humidifier_socket_1
  - trigger: event
    event_type: timer.finished
    event_data:
      entity_id: timer.dehumidify_cooldown
  - trigger: event
    event_type: timer.finished
    event_data:
      entity_id: timer.humidify_cooldown
  - trigger: event
    event_type: timer.finished
    event_data:
      entity_id: timer.dehumidifier_manual_grace
  - trigger: event
    event_type: timer.finished
    event_data:
      entity_id: timer.humidifier_manual_grace
  - trigger: homeassistant
    event: start
  - trigger: time_pattern
    minutes: /5
  variables:
    humidity:        "{{ states('sensor.tz3000_utwgoauk_snzb_02_humidity') | float(0) }}"
    set_point:       "{{ states('input_number.humidity_set_point') | float(0) }}"
    tolerance:       "{{ states('input_number.humidity_tolerance') | float(0) }}"
    dehum_on:        "{{ is_state('switch.studio_dehumidifier', 'on') }}"
    humid_on:        "{{ is_state('switch.studio_humidifier_socket_1', 'on') }}"
    # Cross-device cooldowns: dehumidify_cd (armed on dehum OFF) gates the
    # HUMIDIFIER on; humidify_cd (armed on humid OFF) gates the DEHUMIDIFIER on.
    # A device's own cooldown never gates itself — same-device cycling is bounded
    # by its own tolerance-wide hold region, so the active device re-engages
    # promptly.
    dehumidify_cd:   "{{ is_state('timer.dehumidify_cooldown', 'active') }}"
    humidify_cd:     "{{ is_state('timer.humidify_cooldown', 'active') }}"
    dehum_grace:     "{{ is_state('timer.dehumidifier_manual_grace', 'active') }}"
    humid_grace:     "{{ is_state('timer.humidifier_manual_grace', 'active') }}"
    desired_dehum: >-
      {{ true if humidity >= (set_point + tolerance)
         else false if humidity < set_point
         else dehum_on }}
    desired_humid: >-
      {{ true if humidity <= (set_point - tolerance)
         else false if humidity > set_point
         else humid_on }}
  conditions:
  - "{{ states('sensor.tz3000_utwgoauk_snzb_02_humidity') not in ['unavailable', 'unknown'] }}"
  - "{{ states('input_number.humidity_set_point') not in ['unavailable', 'unknown'] }}"
  - "{{ states('input_number.humidity_tolerance') not in ['unavailable', 'unknown'] }}"
  - "{{ states('switch.studio_dehumidifier') not in ['unavailable', 'unknown'] }}"
  - "{{ states('switch.studio_humidifier_socket_1') not in ['unavailable', 'unknown'] }}"
  actions:
  - choose:
    # 1) Mutual-exclusion safety — both on: humidity picks the loser.
    #    Overrides cooldown and grace. Backstop for externally-induced both-on.
    - conditions: "{{ dehum_on and humid_on }}"
      sequence:
      - if: "{{ humidity > set_point }}"
        then:
        - action: input_boolean.turn_off
          target:
            entity_id: input_boolean.humidifier_intended
        - action: switch.turn_off
          target:
            entity_id: switch.studio_humidifier_socket_1
        # Arm the loser's own cooldown so it gates the opposite device's restart.
        - action: timer.start
          target:
            entity_id: timer.humidify_cooldown
        else:
        - action: input_boolean.turn_off
          target:
            entity_id: input_boolean.dehumidifier_intended
        - action: switch.turn_off
          target:
            entity_id: switch.studio_dehumidifier
        - action: timer.start
          target:
            entity_id: timer.dehumidify_cooldown
    # 2) Dehumidifier should turn OFF (respect manual grace). Arm the dehumidify
    #    cooldown so a downward overshoot recovers before the humidifier reacts.
    - conditions: "{{ not desired_dehum and dehum_on and not dehum_grace }}"
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.dehumidifier_intended
      - action: switch.turn_off
        target:
          entity_id: switch.studio_dehumidifier
      - action: timer.start
        target:
          entity_id: timer.dehumidify_cooldown
    # 3) Humidifier should turn OFF (respect manual grace). Arm the humidify
    #    cooldown so an upward overshoot recovers before the dehumidifier reacts.
    - conditions: "{{ not desired_humid and humid_on and not humid_grace }}"
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.humidifier_intended
      - action: switch.turn_off
        target:
          entity_id: switch.studio_humidifier_socket_1
      - action: timer.start
        target:
          entity_id: timer.humidify_cooldown
    # 4) Dehumidifier should turn ON. Gated on: humidifier off (mutual
    #    exclusion), no dehum grace, and the HUMIDIFY cooldown not active (a
    #    recent humidifier-off overshoot must clear first). Its OWN dehumidify
    #    cooldown does not gate it — it re-engages at the high threshold.
    - conditions: >-
        {{ desired_dehum and not dehum_on and not humid_on
           and not dehum_grace and not humidify_cd }}
      sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.dehumidifier_intended
      - action: switch.turn_on
        target:
          entity_id: switch.studio_dehumidifier
    # 5) Humidifier should turn ON. Gated on: dehumidifier off (mutual
    #    exclusion), no humid grace, and the DEHUMIDIFY cooldown not active (a
    #    recent dehumidifier-off overshoot must clear first). Its OWN humidify
    #    cooldown does not gate it — it re-engages at the low threshold.
    - conditions: >-
        {{ desired_humid and not humid_on and not dehum_on
           and not humid_grace and not dehumidify_cd }}
      sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.humidifier_intended
      - action: switch.turn_on
        target:
          entity_id: switch.studio_humidifier_socket_1
  mode: single

- id: studio_humidity_manual_detector
  alias: Studio Humidity Manual Detector
  description: >-
    Detect manual flips of the studio humidifier/dehumidifier switches (any
    change the controller did not command, identified via the *_intended
    mirrors) and arm that switch's 15-min grace window so the controller leaves
    a manual override alone.
  triggers:
  - trigger: state
    entity_id: switch.studio_dehumidifier
  - trigger: state
    entity_id: switch.studio_humidifier_socket_1
  conditions:
  - "{{ trigger.to_state.state in ['on', 'off'] }}"
  - "{{ not trigger.from_state or trigger.from_state.state != trigger.to_state.state }}"
  actions:
  - choose:
    - conditions: >-
        {{ trigger.entity_id == 'switch.studio_dehumidifier'
           and trigger.to_state.state != states('input_boolean.dehumidifier_intended') }}
      sequence:
      - action: "input_boolean.turn_{{ trigger.to_state.state }}"
        target:
          entity_id: input_boolean.dehumidifier_intended
      - action: timer.start
        target:
          entity_id: timer.dehumidifier_manual_grace
    - conditions: >-
        {{ trigger.entity_id == 'switch.studio_humidifier_socket_1'
           and trigger.to_state.state != states('input_boolean.humidifier_intended') }}
      sequence:
      - action: "input_boolean.turn_{{ trigger.to_state.state }}"
        target:
          entity_id: input_boolean.humidifier_intended
      - action: timer.start
        target:
          entity_id: timer.humidifier_manual_grace
  mode: queued

- id: studio_dehumidifier_relay_failure
  alias: Studio Dehumidifier Relay Failure
  description: >-
    Alert when the dehumidifier draws current while its switch is commanded
    off — the signature of a welded relay. The compressor is an inductive load
    and the relay is the part that fails; with the contacts fused shut nothing
    in the control loop can stop the room drying out.
  triggers:
  # The trigger debounces; the condition decides. `above:` cannot read
  # `variables:` — HA renders those only once a trigger has fired — so the
  # threshold is written twice and a test asserts the two agree.
  - trigger: numeric_state
    entity_id: sensor.studio_dehumidifier_electric_consumption_w
    above: 20
    for:
      minutes: 3
  variables:
    # Idle draw on this meter is 0.0 W and the running compressor is in the
    # hundreds, so 20 W clears meter noise without approaching a real load. The
    # 3-minute debounce absorbs the lag between the switch reporting `off` and
    # the wattage reading following it down.
    leak_watts: 20
    draw: "{{ states('sensor.studio_dehumidifier_electric_consumption_w') | float(0) }}"
  conditions:
  - "{{ states('sensor.studio_dehumidifier_electric_consumption_w') not in ['unavailable', 'unknown'] }}"
  - "{{ is_state('switch.studio_dehumidifier', 'off') }}"
  - "{{ draw > leak_watts }}"
  actions:
  - action: notify.notification_group
    data:
      message: >-
        Studio dehumidifier is drawing {{ draw | round(0) }} W with its switch
        off. The relay may be welded shut — unplug it at the wall.
  mode: single

# ============================================================
# Lamps
# ------------------------------------------------------------
# The Eva lamp's plug switches itself off 30 minutes after a
# person turns it on. Home Assistant attaches a context to every
# state write, and only an automation-commanded change carries a
# parent_id — so a single `parent_id is none` check admits both
# the physical button (no user, no parent) and the dashboard
# (user, no parent) while excluding a commanded turn-on. An
# automation triggered with no triggering context of its own (a
# time trigger, or HA start) also reports no parent and would
# read as human; nothing commands this plug, so that gate is
# unreachable. Switching the lamp off cancels the pending cutoff,
# and the cutoff re-checks the lamp is on, so neither path fires
# a redundant call at the Tuya cloud.
# ============================================================

- id: eva_lamp_auto_off
  alias: Eva Lamp Auto Off
  description: >-
    Switch the Eva lamp off 30 minutes after a person turns it on. The physical
    button and the Home Assistant UI both arm the cutoff; a turn-on commanded by
    an automation does not. Switching the lamp off cancels a pending cutoff.
  triggers:
  - trigger: state
    entity_id: switch.eva_lamp_socket_1
    to: 'on'
    id: manual_on
  - trigger: state
    entity_id: switch.eva_lamp_socket_1
    to: 'off'
    id: lamp_off
  - trigger: event
    event_type: timer.finished
    event_data:
      entity_id: timer.eva_lamp_auto_off
    id: timer_done
  actions:
  - choose:
    # Jinja `and` short-circuits, so trigger.to_state is only read on the
    # branch whose trigger actually carries one.
    - conditions: >-
        {{ trigger.id == 'manual_on'
           and trigger.to_state.context.parent_id is none }}
      sequence:
      - action: timer.start
        target:
          entity_id: timer.eva_lamp_auto_off
    - conditions: "{{ trigger.id == 'lamp_off' }}"
      sequence:
      - action: timer.cancel
        target:
          entity_id: timer.eva_lamp_auto_off
    - conditions: >-
        {{ trigger.id == 'timer_done'
           and is_state('switch.eva_lamp_socket_1', 'on') }}
      sequence:
      - action: switch.turn_off
        target:
          entity_id: switch.eva_lamp_socket_1
  mode: queued
