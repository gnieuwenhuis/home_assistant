# ============================================================
# HVAC controllers
# ------------------------------------------------------------
# One coordinator drives the multi-split (shared compressor →
# one system-wide heat/cool mode). It reads both rooms' two-
# setpoint demand (heat below heat_bound, cool above cool_bound,
# with a hysteresis differential past each bound), resolves a
# single system-wide mode where heating wins any conflict, then
# drives each head's power switch + climate target toward its
# bound (a small lead past the bound keeps the inverter
# committed). Short-cycle protection comes from per-head lockout
# timers and a heat<->cool minimum dwell that pins the active
# mode. Master-off (input_boolean.hvac_enable off) and backup-
# heat force both heads off. Every Cielo call is gated on a real
# desired-vs-current delta so no redundant API writes are made.
# ============================================================

- id: hvac_coordinator
  alias: HVAC Coordinator
  description: >-
    One coordinator for the multi-split. Resolves a single system-wide mode from
    both rooms' two-setpoint demand (heating wins conflicts), then drives each
    head on/off toward its bounds. Short-cycle protected by per-head lockout
    timers and a heat<->cool dwell. Master-off / backup-heat force both heads
    off. Every Cielo call gated on a real desired-vs-current delta.
  triggers:
  - trigger: state
    entity_id:
    - sensor.office_baseboard_current_temperature
    - sensor.studio_baseboard_current_temperature
    - input_number.office_heat_bound
    - input_number.office_cool_bound
    - input_number.studio_heat_bound
    - input_number.studio_cool_bound
    - input_number.office_temp_differential
    - input_number.studio_temp_differential
    - input_boolean.hvac_enable
    - input_boolean.backup_heat
  - trigger: event
    event_type: timer.finished
    event_data:
      entity_id: timer.mode_min_dwell
  - trigger: event
    event_type: timer.finished
    event_data:
      entity_id: timer.office_head_lockout
  - trigger: event
    event_type: timer.finished
    event_data:
      entity_id: timer.studio_head_lockout
  - trigger: homeassistant
    event: start
  - trigger: time_pattern
    minutes: /5
  variables:
    # Command each head to the bound itself (no lead past it). The head's own
    # sensor is unreliable and state-dependent (off: reads refrigerant-pipe temp
    # driven by the other head; running: converges to room temp). Steering past
    # the bound made a running head drive the room well past it (the over-cool
    # yo-yo). At the bound, a running head eases off near the bound on its own,
    # and the baseboard backstop (prompt turn-off) catches the startup transient.
    lead: 0
    enabled: "{{ is_state('input_boolean.hvac_enable', 'on') }}"
    backup: "{{ is_state('input_boolean.backup_heat', 'on') }}"
    stored: "{{ states('input_select.system_hvac_mode') }}"
    dwell_active: "{{ is_state('timer.mode_min_dwell', 'active') }}"
    office_temp: "{{ states('sensor.office_baseboard_current_temperature') | float(0) }}"
    studio_temp: "{{ states('sensor.studio_baseboard_current_temperature') | float(0) }}"
    office_hb: "{{ states('input_number.office_heat_bound') | float(0) }}"
    office_cb: "{{ states('input_number.office_cool_bound') | float(0) }}"
    studio_hb: "{{ states('input_number.studio_heat_bound') | float(0) }}"
    studio_cb: "{{ states('input_number.studio_cool_bound') | float(0) }}"
    office_diff: "{{ states('input_number.office_temp_differential') | float(0) }}"
    studio_diff: "{{ states('input_number.studio_temp_differential') | float(0) }}"
    office_switch_on: "{{ is_state('switch.office_power', 'on') }}"
    studio_switch_on: "{{ is_state('switch.studio_power', 'on') }}"
    office_dir: "{{ stored if office_switch_on and stored in ['heat', 'cool'] else 'none' }}"
    studio_dir: "{{ stored if studio_switch_on and stored in ['heat', 'cool'] else 'none' }}"
    office_demand: >-
      {% from 'hvac.jinja' import room_demand %}
      {{- room_demand(office_temp, office_hb, office_cb, office_diff, office_dir) -}}
    studio_demand: >-
      {% from 'hvac.jinja' import room_demand %}
      {{- room_demand(studio_temp, studio_hb, studio_cb, studio_diff, studio_dir) -}}
    resolved: >-
      {% from 'hvac.jinja' import resolve_mode %}
      {{- resolve_mode(office_demand, studio_demand) -}}
    effective: "{{ stored if (dwell_active and stored in ['heat', 'cool']) else resolved }}"
    office_want_on: >-
      {{ (effective == 'heat' and office_demand == 'heat')
         or (effective == 'cool' and office_demand == 'cool') }}
    studio_want_on: >-
      {{ (effective == 'heat' and studio_demand == 'heat')
         or (effective == 'cool' and studio_demand == 'cool') }}
    desired_hvac: "{{ 'heat' if effective == 'heat' else 'cool' if effective == 'cool' else '' }}"
    office_target_raw: >-
      {% from 'hvac.jinja' import head_target %}
      {{- head_target(effective, office_hb, office_cb, lead) -}}
    studio_target_raw: >-
      {% from 'hvac.jinja' import head_target %}
      {{- head_target(effective, studio_hb, studio_cb, lead) -}}
    office_target: "{{ office_target_raw | float(0) }}"
    studio_target: "{{ studio_target_raw | float(0) }}"
    office_lockout: "{{ is_state('timer.office_head_lockout', 'active') }}"
    studio_lockout: "{{ is_state('timer.studio_head_lockout', 'active') }}"
    current_office_hvac: "{{ states('climate.office') }}"
    current_studio_hvac: "{{ states('climate.studio') }}"
    current_office_target: "{{ state_attr('climate.office', 'temperature') | float(0) }}"
    current_studio_target: "{{ state_attr('climate.studio', 'temperature') | float(0) }}"
    safe_mode: "{{ 'off' if not enabled else 'idle' }}"
  conditions:
  - "{{ states('sensor.office_baseboard_current_temperature') not in ['unavailable', 'unknown'] }}"
  - "{{ states('sensor.studio_baseboard_current_temperature') not in ['unavailable', 'unknown'] }}"
  - "{{ states('switch.office_power') not in ['unavailable', 'unknown'] }}"
  - "{{ states('switch.studio_power') not in ['unavailable', 'unknown'] }}"
  - "{{ states('climate.office') not in ['unavailable', 'unknown'] }}"
  - "{{ states('climate.studio') not in ['unavailable', 'unknown'] }}"
  actions:
  - if: "{{ not enabled or backup }}"
    then:
    # Force-off ignores an active lockout, but still ARMS the lockout so a quick
    # re-enable / backup-heat flap can't restart the compressor immediately.
    - if: "{{ office_switch_on }}"
      then:
      - action: switch.turn_off
        target:
          entity_id: switch.office_power
      - action: timer.start
        target:
          entity_id: timer.office_head_lockout
    - if: "{{ studio_switch_on }}"
      then:
      - action: switch.turn_off
        target:
          entity_id: switch.studio_power
      - action: timer.start
        target:
          entity_id: timer.studio_head_lockout
    - if: "{{ stored != safe_mode }}"
      then:
      - action: input_select.select_option
        target:
          entity_id: input_select.system_hvac_mode
        data:
          option: "{{ safe_mode }}"
    - stop: master disabled or backup heat
  - if: "{{ effective != stored }}"
    then:
    - action: input_select.select_option
      target:
        entity_id: input_select.system_hvac_mode
      data:
        option: "{{ effective }}"
    - if: "{{ effective in ['heat', 'cool'] }}"
      then:
      - action: timer.start
        target:
          entity_id: timer.mode_min_dwell
  - choose:
    - conditions: "{{ office_want_on and not office_switch_on and not office_lockout }}"
      sequence:
      - action: switch.turn_on
        target:
          entity_id: switch.office_power
      - action: climate.set_temperature
        target:
          entity_id: climate.office
        data:
          temperature: "{{ office_target }}"
          hvac_mode: "{{ desired_hvac }}"
      - action: timer.start
        target:
          entity_id: timer.office_head_lockout
    - conditions: >-
        {{ office_want_on and office_switch_on
           and (current_office_hvac != desired_hvac
                or current_office_target != office_target) }}
      sequence:
      - action: climate.set_temperature
        target:
          entity_id: climate.office
        data:
          temperature: "{{ office_target }}"
          hvac_mode: "{{ desired_hvac }}"
    # Turn OFF as soon as demand ends — NOT gated on the lockout. The lockout is
    # a minimum OFF-time (it gates the next turn-ON); blocking the off forces the
    # head to over-cool/over-heat past the bound. Arm the lockout on the off.
    - conditions: "{{ not office_want_on and office_switch_on }}"
      sequence:
      - action: switch.turn_off
        target:
          entity_id: switch.office_power
      - action: timer.start
        target:
          entity_id: timer.office_head_lockout
  - choose:
    - conditions: "{{ studio_want_on and not studio_switch_on and not studio_lockout }}"
      sequence:
      - action: switch.turn_on
        target:
          entity_id: switch.studio_power
      - action: climate.set_temperature
        target:
          entity_id: climate.studio
        data:
          temperature: "{{ studio_target }}"
          hvac_mode: "{{ desired_hvac }}"
      - action: timer.start
        target:
          entity_id: timer.studio_head_lockout
    - conditions: >-
        {{ studio_want_on and studio_switch_on
           and (current_studio_hvac != desired_hvac
                or current_studio_target != studio_target) }}
      sequence:
      - action: climate.set_temperature
        target:
          entity_id: climate.studio
        data:
          temperature: "{{ studio_target }}"
          hvac_mode: "{{ desired_hvac }}"
    # Turn OFF as soon as demand ends — NOT gated on the lockout (see office).
    - conditions: "{{ not studio_want_on and studio_switch_on }}"
      sequence:
      - action: switch.turn_off
        target:
          entity_id: switch.studio_power
      - action: timer.start
        target:
          entity_id: timer.studio_head_lockout
  mode: single

# ============================================================
# Backup heat
# ------------------------------------------------------------
# Heat pumps lose efficiency below -12 °C. When the outdoor
# temperature drops, disable heat-pump heating and fall back
# to the Sinopé baseboard heaters at the room's preferred
# temperature; reverse when it warms up (baseboards drop 2.5
# °C below preferred so the heat pump takes over).
# ============================================================

- id: '1756873917108'
  alias: Disable Heat Pump in Cold Weather
  description: ''
  triggers:
  - trigger: numeric_state
    entity_id:
    - sensor.lethbridge_temperature
    for:
      hours: 0
      minutes: 20
      seconds: 0
    below: -12
  conditions:
  - condition: state
    entity_id: input_boolean.backup_heat
    state: 'off'
  actions:
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.backup_heat
  - action: climate.set_temperature
    target:
      entity_id: climate.neviweb130_climate_th1123wf
    data:
      temperature: >-
        {{ ((states('input_number.office_heat_bound') | float
             + states('input_number.office_cool_bound') | float) / 2) | round(0) }}
  - action: climate.set_temperature
    target:
      entity_id: climate.neviweb130_climate_th1124wf
    data:
      temperature: >-
        {{ ((states('input_number.studio_heat_bound') | float
             + states('input_number.studio_cool_bound') | float) / 2) | round(0) }}
  - action: notify.notification_group
    data:
      message: Heat Pump Heating is Disabled, Baseboard Heat is Being Used
  mode: single

- id: '1756874009383'
  alias: Enable Heat pump in warm weather
  description: ''
  triggers:
  - trigger: numeric_state
    entity_id:
    - sensor.lethbridge_temperature
    for:
      hours: 0
      minutes: 20
      seconds: 0
    above: -12
  conditions:
  - condition: state
    entity_id: input_boolean.backup_heat
    state: 'on'
  actions:
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.backup_heat
  - action: climate.set_temperature
    target:
      entity_id: climate.neviweb130_climate_th1123wf
    data:
      temperature: "{{ states('input_number.office_heat_bound') | float - 2.5 }}"
  - action: climate.set_temperature
    target:
      entity_id: climate.neviweb130_climate_th1124wf
    data:
      temperature: "{{ states('input_number.studio_heat_bound') | float - 2.5 }}"
  - action: notify.notification_group
    data:
      message: Heat Pump is Enabled
  mode: single

# ============================================================
# Humidity
# ------------------------------------------------------------
# One state-driven controller reconciles the studio humidifier
# and dehumidifier from the current humidity level (it replaced
# four edge-triggered on/off automations). It:
#   - never lets both run at once (mutual-exclusion safety),
#   - forces a 15-min relaxation cooldown after a controller
#     turn-off before the opposite device may start (stops the
#     overshoot ping-pong), and
#   - respects a manual switch flip for 15 min before resuming.
# Hysteresis around input_number.humidity_set_point with
# input_number.humidity_tolerance:
#   dehumidifier ON at set_point+tol, OFF below set_point
#   humidifier   ON at set_point-tol, OFF above set_point
# The manual detector tells controller-issued switch changes
# apart from manual ones via the *_intended mirror booleans.
# ============================================================

- id: studio_humidity_controller
  alias: Studio Humidity Controller
  description: >-
    Reconcile the studio humidifier/dehumidifier from the current humidity
    level. Enforces mutual exclusion (never both on), a 15-min cross-device
    relaxation cooldown after a controller turn-off, and a 15-min grace window
    after a manual switch flip. Fires on humidity/setpoint/switch/timer changes,
    HA start, and a 5-min heartbeat. Performs at most one action per run, gated
    on real deltas.
  triggers:
  - trigger: state
    entity_id:
    - sensor.tz3000_utwgoauk_snzb_02_humidity
    - input_number.humidity_set_point
    - input_number.humidity_tolerance
    - switch.mini_plug_4_socket_1
    - switch.studio_humidifier_socket_1
  - trigger: event
    event_type: timer.finished
    event_data:
      entity_id: timer.humidity_cooldown
  - trigger: event
    event_type: timer.finished
    event_data:
      entity_id: timer.dehumidifier_manual_grace
  - trigger: event
    event_type: timer.finished
    event_data:
      entity_id: timer.humidifier_manual_grace
  - trigger: homeassistant
    event: start
  - trigger: time_pattern
    minutes: /5
  variables:
    humidity:        "{{ states('sensor.tz3000_utwgoauk_snzb_02_humidity') | float(0) }}"
    set_point:       "{{ states('input_number.humidity_set_point') | float(0) }}"
    tolerance:       "{{ states('input_number.humidity_tolerance') | float(0) }}"
    dehum_on:        "{{ is_state('switch.mini_plug_4_socket_1', 'on') }}"
    humid_on:        "{{ is_state('switch.studio_humidifier_socket_1', 'on') }}"
    cooldown_active: "{{ is_state('timer.humidity_cooldown', 'active') }}"
    dehum_grace:     "{{ is_state('timer.dehumidifier_manual_grace', 'active') }}"
    humid_grace:     "{{ is_state('timer.humidifier_manual_grace', 'active') }}"
    desired_dehum: >-
      {{ true if humidity >= (set_point + tolerance)
         else false if humidity < set_point
         else dehum_on }}
    desired_humid: >-
      {{ true if humidity <= (set_point - tolerance)
         else false if humidity > set_point
         else humid_on }}
  conditions:
  - "{{ states('sensor.tz3000_utwgoauk_snzb_02_humidity') not in ['unavailable', 'unknown'] }}"
  - "{{ states('input_number.humidity_set_point') not in ['unavailable', 'unknown'] }}"
  - "{{ states('input_number.humidity_tolerance') not in ['unavailable', 'unknown'] }}"
  - "{{ states('switch.mini_plug_4_socket_1') not in ['unavailable', 'unknown'] }}"
  - "{{ states('switch.studio_humidifier_socket_1') not in ['unavailable', 'unknown'] }}"
  actions:
  - choose:
    # 1) Mutual-exclusion safety — both on: humidity picks the loser.
    #    Overrides cooldown and grace. Backstop for externally-induced both-on.
    - conditions: "{{ dehum_on and humid_on }}"
      sequence:
      - if: "{{ humidity > set_point }}"
        then:
        - action: input_boolean.turn_off
          target:
            entity_id: input_boolean.humidifier_intended
        - action: switch.turn_off
          target:
            entity_id: switch.studio_humidifier_socket_1
        else:
        - action: input_boolean.turn_off
          target:
            entity_id: input_boolean.dehumidifier_intended
        - action: switch.turn_off
          target:
            entity_id: switch.mini_plug_4_socket_1
      - action: timer.start
        target:
          entity_id: timer.humidity_cooldown
    # 2) Dehumidifier should turn OFF (respect manual grace). Start cooldown.
    - conditions: "{{ not desired_dehum and dehum_on and not dehum_grace }}"
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.dehumidifier_intended
      - action: switch.turn_off
        target:
          entity_id: switch.mini_plug_4_socket_1
      - action: timer.start
        target:
          entity_id: timer.humidity_cooldown
    # 3) Humidifier should turn OFF (respect manual grace). Start cooldown.
    - conditions: "{{ not desired_humid and humid_on and not humid_grace }}"
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.humidifier_intended
      - action: switch.turn_off
        target:
          entity_id: switch.studio_humidifier_socket_1
      - action: timer.start
        target:
          entity_id: timer.humidity_cooldown
    # 4) Dehumidifier should turn ON. Gated on: humidifier off (mutual
    #    exclusion), no dehum grace, cooldown not active.
    - conditions: >-
        {{ desired_dehum and not dehum_on and not humid_on
           and not dehum_grace and not cooldown_active }}
      sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.dehumidifier_intended
      - action: switch.turn_on
        target:
          entity_id: switch.mini_plug_4_socket_1
    # 5) Humidifier should turn ON. Gated on: dehumidifier off (mutual
    #    exclusion), no humid grace, cooldown not active.
    - conditions: >-
        {{ desired_humid and not humid_on and not dehum_on
           and not humid_grace and not cooldown_active }}
      sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.humidifier_intended
      - action: switch.turn_on
        target:
          entity_id: switch.studio_humidifier_socket_1
  mode: single

- id: studio_humidity_manual_detector
  alias: Studio Humidity Manual Detector
  description: >-
    Detect manual flips of the studio humidifier/dehumidifier switches (any
    change the controller did not command, identified via the *_intended
    mirrors) and arm that switch's 15-min grace window so the controller leaves
    a manual override alone.
  triggers:
  - trigger: state
    entity_id: switch.mini_plug_4_socket_1
  - trigger: state
    entity_id: switch.studio_humidifier_socket_1
  conditions:
  - "{{ trigger.to_state.state in ['on', 'off'] }}"
  - "{{ not trigger.from_state or trigger.from_state.state != trigger.to_state.state }}"
  actions:
  - choose:
    - conditions: >-
        {{ trigger.entity_id == 'switch.mini_plug_4_socket_1'
           and trigger.to_state.state != states('input_boolean.dehumidifier_intended') }}
      sequence:
      - action: "input_boolean.turn_{{ trigger.to_state.state }}"
        target:
          entity_id: input_boolean.dehumidifier_intended
      - action: timer.start
        target:
          entity_id: timer.dehumidifier_manual_grace
    - conditions: >-
        {{ trigger.entity_id == 'switch.studio_humidifier_socket_1'
           and trigger.to_state.state != states('input_boolean.humidifier_intended') }}
      sequence:
      - action: "input_boolean.turn_{{ trigger.to_state.state }}"
        target:
          entity_id: input_boolean.humidifier_intended
      - action: timer.start
        target:
          entity_id: timer.humidifier_manual_grace
  mode: queued
