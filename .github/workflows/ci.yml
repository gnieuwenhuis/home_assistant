---
name: CI

# The job names below (`lint`, `test`) are the required status check contexts
# in the `main` ruleset. Renaming a job silently disarms the merge gate until
# the ruleset is updated to match.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    # GitHub's default is 6 hours. Once these are required checks, a hung job
    # is a PR nobody can merge until it expires.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Install yamllint
        run: pipx install yamllint

      - name: Lint HA configuration
        run: yamllint -f github automations.yaml helpers.yaml configuration.yaml

      - name: Lint workflows
        uses: raven-actions/actionlint@v2

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -q
